<!DOCTYPE html>
<html>
<head>
  <title>AI Interview Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>AI Interview Coach</h1>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="resume" required>
    <button type="submit">Upload Resume</button>
  </form>

  <div id="questions"></div>

  <script>
  document.getElementById("uploadForm").onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const res = await fetch("/upload", { method: "POST", body: formData });
    const data = await res.json();
    document.getElementById("questions").innerHTML = `
      <h3>Extracted Skills:</h3>
      <p>${data.skills.join(", ")}</p>
      <h3>Generated Questions:</h3>
      ${data.questions.map(q => `<p>${q}</p><textarea id='ans'></textarea><button onclick="sendFeedback('${q}')">Get Feedback</button>`).join("")}
    `;
  };

  async function sendFeedback(question) {
    const answer = document.getElementById('ans').value;
    const res = await fetch("/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, answer })
    });
    const data = await res.json();
    alert("Feedback: " + data.feedback);
  }
  </script>
</body>
</html>
