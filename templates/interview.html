<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Session</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🧠 AI Interview Session</h1>

        <h3>Skills Detected:</h3>
        <p>{{ ', '.join(skills) }}</p>

        <form id="interviewForm">
            {% for q in questions %}
            <div class="question-block">
                <p><strong>Q{{ loop.index }}:</strong> {{ q }}</p>
                <textarea name="answer{{ loop.index }}" placeholder="Type your answer here..." required></textarea>
            </div>
            {% endfor %}
            <button type="button" id="submitAll">Submit All Answers</button>
        </form>

        <div id="feedbackSection"></div>

        <button onclick="window.location.href='/'">⬅️ Back to Home</button>
    </div>

    <script>
        document.getElementById("submitAll").addEventListener("click", async () => {
            const form = document.getElementById("interviewForm");
            const feedbackDiv = document.getElementById("feedbackSection");
            feedbackDiv.innerHTML = "<p>Processing feedback...</p>";

            const questions = {{ questions|tojson }};
            const answers = Array.from(form.elements)
                                 .filter(e => e.tagName === "TEXTAREA")
                                 .map(e => e.value);

            let resultsHTML = "";

            for (let i = 0; i < questions.length; i++) {
                const response = await fetch("/feedback", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question: questions[i],
                        answer: answers[i]
                    })
                });
                const data = await response.json();
                resultsHTML += `<div class='feedback-box'>
                                    <p><strong>Q${i + 1}:</strong> ${questions[i]}</p>
                                    <p><strong>Feedback:</strong> ${data.feedback}</p>
                                </div>`;
            }

            // ✅ Add thank-you message at the end
            resultsHTML += `
                <div class='thankyou-message'>
                    <h2>🎉 Thank you for completing the interview!</h2>
                    <p>Our team will review your answers and reach out to you if you qualify.</p>
                </div>
            `;

            feedbackDiv.innerHTML = resultsHTML;
        });
    </script>
</body>
</html>
